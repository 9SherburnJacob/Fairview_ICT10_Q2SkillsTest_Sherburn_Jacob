<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Redaction+50:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        button{
            border-radius: 15px;
            width: 170px;
        }
        input{
            border-radius: 15px;
            width: 170px;
        }
        body{
            text-align: center;
            font-family: "Redaction 50";
            font-size: large;
        }

    </style>
    <title>Document</title>
</head>
<body>
    <div>
        <br><br>    
        <h1 class="text-center">Non-Metal Element Information</h1>
        <br><br>
        <p>Enter a Non-metal's Element symbol to search!</p>
        <input type="text" id="element1" placeholder="Example: (B, N, Te, Og)">
        <br><br>
        <button py-click="search_element">Search Element</button>
        <br><br>

        <div class="result">
            <h3>Showcase Result</h3>
            <br>
                <!--Symbol, Name, Atomic Number, Atomic Mass-->
            <p><b>Element Symbol: </b><span id="symbol"></span></p>
            <p><b>Element Name: </b><span id="name"></span></p>
            <p><b>Atomic Number: </b><span id="number"></span></p>
            <p><b>Atomic Mass: </b><span id="mass"></span></p>
        </div>

     <script type="py" src="main.py"></script>

</body>
</html>
